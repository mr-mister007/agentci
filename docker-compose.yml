services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    volumes:
      - agentci-data:/app/.agentci/data

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "4173:4173"
    depends_on:
      - api

volumes:
  agentci-data:
