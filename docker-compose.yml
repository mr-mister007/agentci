services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agentci
      POSTGRES_PASSWORD: ${AGENTCI_POSTGRES_PASSWORD:-agentci}
      POSTGRES_DB: agentci
    volumes:
      - agentci-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentci -d agentci"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - agentci-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      AGENTCI_ENVIRONMENT: prod
      AGENTCI_DATABASE_URL: postgresql+asyncpg://agentci:${AGENTCI_POSTGRES_PASSWORD:-agentci}@postgres:5432/agentci
      AGENTCI_REDIS_URL: redis://redis:6379/0
      AGENTCI_BOOTSTRAP_API_KEY: ${AGENTCI_BOOTSTRAP_API_KEY:?set AGENTCI_BOOTSTRAP_API_KEY}
      AGENTCI_BOOTSTRAP_ORG_NAME: ${AGENTCI_BOOTSTRAP_ORG_NAME:-default}
      AGENTCI_CORS_ORIGINS: '["http://localhost:4173"]'
      AGENTCI_ARTIFACT_BACKEND: ${AGENTCI_ARTIFACT_BACKEND:-local}
      AGENTCI_ARTIFACT_ROOT: /app/.agentci/artifacts
    ports:
      - "8000:8000"
    volumes:
      - agentci-artifacts:/app/.agentci/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: ["agentci-worker"]
    environment:
      AGENTCI_ENVIRONMENT: prod
      AGENTCI_DATABASE_URL: postgresql+asyncpg://agentci:${AGENTCI_POSTGRES_PASSWORD:-agentci}@postgres:5432/agentci
      AGENTCI_REDIS_URL: redis://redis:6379/0
      AGENTCI_BOOTSTRAP_API_KEY: ${AGENTCI_BOOTSTRAP_API_KEY:?set AGENTCI_BOOTSTRAP_API_KEY}
      AGENTCI_ARTIFACT_BACKEND: ${AGENTCI_ARTIFACT_BACKEND:-local}
      AGENTCI_ARTIFACT_ROOT: /app/.agentci/artifacts
      AGENTCI_ALLOW_PRIVATE_ENDPOINTS: "1"
    volumes:
      - agentci-artifacts:/app/.agentci/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_API_URL: ${AGENTCI_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "4173:4173"
    depends_on:
      - api

volumes:
  agentci-postgres:
  agentci-redis:
  agentci-artifacts:
