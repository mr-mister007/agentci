[project]
name = "agentci-core"
version = "0.1.0"
description = "Shared models, configuration, and gate engine for AgentCI."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9", "pyyaml>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentci_core"]
