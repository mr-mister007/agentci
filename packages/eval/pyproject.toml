[project]
name = "agentci-eval"
version = "0.1.0"
description = "Built-in scorers and custom scorer SDK for AgentCI."
requires-python = ">=3.12"
dependencies = ["agentci-core>=0.1.0", "jsonschema>=4.23", "pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentci_eval"]
