[project]
name = "agentci-cli"
version = "0.1.0"
description = "The agentci command line interface."
requires-python = ">=3.12"
dependencies = [
    "agentci-core>=0.1.0",
    "agentci-eval>=0.1.0",
    "agentci-runner>=0.1.0",
    "agentci-testgen>=0.1.0",
    "httpx>=0.27",
    "rich>=13.9",
    "typer>=0.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentci_cli"]

[project.scripts]
agentci = "agentci_cli.main:app"
