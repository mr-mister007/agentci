[project]
name = "agentci-api"
version = "0.1.0"
description = "FastAPI report and status-check API for AgentCI."
requires-python = ">=3.12"
dependencies = ["agentci-core>=0.1.0", "agentci-runner>=0.1.0", "fastapi>=0.115", "uvicorn>=0.32"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentci_api"]

[project.scripts]
agentci-api = "agentci_api.main:run"
