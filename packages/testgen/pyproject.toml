[project]
name = "agentci-testgen"
version = "0.1.0"
description = "Synthetic test case generation for AgentCI."
requires-python = ">=3.12"
dependencies = ["agentci-core>=0.1.0", "pyyaml>=6.0", "pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentci_testgen"]
